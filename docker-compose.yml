services:
  postgres:
    image: postgres:16-alpine
    container_name: wavecrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wave
      POSTGRES_PASSWORD: wave
      POSTGRES_DB: wavecrm
    ports:
      - "5432:5432"
    volumes:
      - wavecrm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wave -d wavecrm"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: wavecrm-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: wavecrm-sonarqube
    profiles: ["quality"]
    restart: unless-stopped
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - wavecrm_sonarqube_data:/opt/sonarqube/data
      - wavecrm_sonarqube_extensions:/opt/sonarqube/extensions
      - wavecrm_sonarqube_logs:/opt/sonarqube/logs

volumes:
  wavecrm_postgres_data:
  wavecrm_sonarqube_data:
  wavecrm_sonarqube_extensions:
  wavecrm_sonarqube_logs:
