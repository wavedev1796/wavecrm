sonar.projectKey=WaveCRM
sonar.projectName=Wave CRM
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Código de producción
sonar.sources=apps/api/src,apps/web/app,apps/web/components,apps/web/features,apps/web/content,apps/web/lib,apps/web/styles,apps/web/middleware.ts,packages/shared/src,packages/database/src,packages/database/prisma
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,packages/database/prisma/migrations/**,apps/web/**/*.test.ts,apps/web/**/*.test.tsx,apps/web/**/*-fixture.ts

# Duplicación deliberada: reglas espejo entre web y API, protegidas por test/casos-de-validacion.json
sonar.cpd.exclusions=apps/web/lib/validation.ts,apps/api/src/common/validation.ts,apps/web/lib/phone.ts,apps/api/src/common/phone.ts

# Pruebas: unitarias e integración del API (apps/api/test/{unitarias,integracion}), Vitest de la web junto a cada archivo
# (con sus datos *-fixture.ts) y test/ en la raíz: datos compartidos y e2e de Playwright (test/e2e)
sonar.tests=apps/api/test,apps/web,test
sonar.test.inclusions=apps/api/test/**/*.cjs,apps/web/**/*.test.ts,apps/web/**/*.test.tsx,apps/web/**/*-fixture.ts,test/**

# Cobertura
sonar.coverage.exclusions=**/*.d.ts,**/*.config.*,apps/api/src/main.ts,apps/api/src/**/**.module.ts,apps/web/app/**/layout.tsx,packages/shared/src/**
sonar.javascript.lcov.reportPaths=coverage/api/lcov.info,coverage/web/lcov.info
sonar.scm.provider=git
