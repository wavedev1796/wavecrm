sonar.projectKey=WaveCRM
sonar.projectName=Wave CRM
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Código de producción
sonar.sources=apps/api/src,apps/web/app,apps/web/components,apps/web/lib,apps/web/middleware.ts,packages/database/src,packages/database/prisma
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,packages/database/prisma/migrations/**,apps/web/**/*.test.ts,apps/web/**/*.test.tsx

# Pruebas: unitarias e integración del API, Vitest de la web, e2e de Playwright y datos compartidos
sonar.tests=apps/api/test,apps/web,e2e,test
sonar.test.inclusions=apps/api/test/**/*.cjs,apps/web/**/*.test.ts,apps/web/**/*.test.tsx,e2e/**/*.ts,test/**

# Cobertura
sonar.coverage.exclusions=**/*.d.ts,**/*.config.*,apps/api/src/main.ts,apps/api/src/**/**.module.ts,apps/web/app/**/layout.tsx
sonar.javascript.lcov.reportPaths=coverage/api/lcov.info,coverage/web/lcov.info
sonar.scm.provider=git
