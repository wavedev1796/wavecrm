services:
  - type: web
    name: wavecrm-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @wave/database generate && pnpm --filter @wave/api build
    preDeployCommand: corepack enable && pnpm --filter @wave/database migrate:deploy
    startCommand: pnpm --filter @wave/api start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: wavecrm-web
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @wave/web build
    startCommand: pnpm --filter @wave/web start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL
        sync: false
