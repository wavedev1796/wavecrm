name: CI

on:
  pull_request:
  push:
    branches: [main, develop, ZaithManangon-Dev, EduardoGarcia-Dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # build va antes que test: @wave/database se consume desde dist/ y en un
      # runner limpio esa carpeta no existe hasta compilarla.
      - run: pnpm build
      - run: pnpm test
